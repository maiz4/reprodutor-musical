<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - Verificações - Lynotes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('')}"></div>

    <main class="spotify-main container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h1 class="glowing-title-library mb-1">Painel do Administrador</h1>
                <p class="text-secondary mb-0">Gerencie solicitações de aprovação e verificação de artistas.</p>
            </div>
        </div>

        <div class="music-card-cyber p-4">
            <div th:if="${artistas.isEmpty()}" class="alert alert-dark border-purple text-purple text-center p-5 rounded-4 mb-0">
                <i class="bi bi-check-circle-fill fs-2 mb-2 d-block text-purple"></i>
                Nenhuma solicitação de verificação pendente no momento.
            </div>

            <div class="table-responsive" th:unless="${artistas.isEmpty()}">
                <table class="table table-dark table-hover align-middle mb-0" style="background: transparent;">
                    <thead>
                        <tr class="border-bottom border-purple">
                            <th>Artista</th>
                            <th>Gênero</th>
                            <th>CPF / Nascimento</th>
                            <th>Endereço Completo</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="artista : ${artistas}">
                            <td>
                                <strong class="text-white fs-6" th:text="${artista.nome}"></strong><br>
                                <span class="text-secondary small" th:text="${artista.biografia}"></span>
                            </td>
                            <td>
                                <span class="badge bg-purple rounded-pill px-3 py-1" th:text="${artista.generoMusical}"></span>
                            </td>
                            <td>
                                <div class="small font-monospace"><i class="bi bi-card-text me-1 text-purple"></i> <span th:text="${artista.cpf}"></span></div>
                                <div class="small font-monospace text-secondary"><i class="bi bi-calendar me-1"></i> <span th:text="${#temporals.format(artista.dataNascimento, 'dd/MM/yyyy')}"></span></div>
                            </td>
                            <td class="small text-secondary">
                                <div><span th:text="${artista.logradouro}"></span>, <span th:text="${artista.numero}"></span></div>
                                <div><span th:text="${artista.bairro}"></span> - <span th:text="${artista.cidade}"></span>/<span th:text="${artista.uf}"></span></div>
                                <div class="font-monospace">CEP: <span th:text="${artista.cep}"></span></div>
                            </td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <form th:action="@{/admin/verificacoes/{id}/aprovar(id=${artista.id})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-outline-success btn-sm rounded-pill px-3" title="Aprovar">
                                            <i class="bi bi-check-lg me-1"></i> Aprovar
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/verificacoes/{id}/rejeitar(id=${artista.id})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3" title="Rejeitar">
                                            <i class="bi bi-x-lg me-1"></i> Rejeitar
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
</body>
</html>
