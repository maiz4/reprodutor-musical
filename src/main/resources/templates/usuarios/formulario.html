<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${edicao ? 'Editar usuário - Lynotes' : 'Criar Conta - Lynotes'}">
        Usuário - Lynotes
    </title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body th:class="${usuarioLogado == null} ? 'auth-container' : 'library-bg text-white'"
      th:attr="hx-boost=${usuarioLogado != null ? 'true' : null}, hx-select=${usuarioLogado != null ? '#app-content' : null}, hx-target=${usuarioLogado != null ? '#app-content' : null}">

    <!-- Main Container para usuários NÃO logados (Centralizado) -->
    <div class="card auth-card p-3 border-0" th:if="${usuarioLogado == null}" style="width: 100%; max-width: 400px; margin: auto;">
        <div class="card-body p-2">
            <div class="text-center mb-3">
                <h1 class="h4 fw-bold auth-title mb-1">Criar Conta</h1>
                <p class="text-secondary small mb-0">Crie seu perfil no Lynotes para catalogar músicas</p>
            </div>

            <div class="alert alert-danger rounded-3 p-2 small mb-3" th:if="${erro}" th:text="${erro}"></div>

            <form method="post" action="/usuarios" autocomplete="off">
                <div class="mb-2">
                    <label class="form-label text-white fw-bold small mb-1" for="nome">Nome</label>
                    <div class="auth-input-group">
                        <span class="auth-icon">
                            <i class="bi bi-person"></i>
                        </span>
                        <input class="form-control" id="nome" name="nome" th:value="${nome}" required autofocus placeholder="Seu nome" autocomplete="new-password">
                    </div>
                </div>

                <div class="mb-2">
                    <label class="form-label text-white fw-bold small mb-1" for="username">Username</label>
                    <div class="auth-input-group">
                        <span class="auth-icon">
                            <i class="bi bi-at"></i>
                        </span>
                        <input class="form-control" id="username" name="username" th:value="${username}" required placeholder="ex: m4iz44" autocomplete="new-password">
                    </div>
                </div>

                <div class="mb-2">
                    <label class="form-label text-white fw-bold small mb-1" for="email">E-mail</label>
                    <div class="auth-input-group">
                        <span class="auth-icon">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input class="form-control" id="email" name="email" type="email" th:value="${email}" required placeholder="nome@email.com" autocomplete="new-password">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white fw-bold small mb-1" for="senha">Senha</label>
                    <div class="auth-input-group">
                        <span class="auth-icon">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input class="form-control" id="senha" name="senha" type="password" required placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
                    </div>
                </div>

                <button class="btn btn-purple btn-add-music-glow w-100 btn-lg mb-3 fw-bold border-0" style="padding: 10px 0;" type="submit">Cadastrar</button>
            </form>
            <div class="text-center mb-2">
                <span class="text-secondary small">Já possui uma conta?</span>
                <a href="/login" hx-boost="false" class="text-purple small fw-bold ms-1 text-decoration-none hover-purple">Entrar na conta</a>
            </div>
            <div class="text-center">
                <a href="/" hx-boost="false" class="text-secondary small text-decoration-none hover-purple">&larr; Voltar para a tela inicial</a>
            </div>
        </div>
    </div>

    <!-- Main Container para usuários logados (Administração) -->
    <div id="app-content" class="w-100" th:if="${usuarioLogado != null}">
        <!-- Navbar (Apenas se logado) -->
        <div th:insert="~{fragments/navbar :: navbar('comunidade')}"></div>

        <main class="spotify-main container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="mb-4">
                        <a class="text-decoration-none" href="/usuarios">&larr; Voltar para usuários</a>
                        <h1 class="mt-2 fw-bold" th:text="${edicao ? 'Editar usuário' : 'Novo usuário'}"></h1>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                            <form method="post" th:action="${acao}">
                                <div class="mb-3">
                                    <label class="form-label" for="nome_admin">Nome</label>
                                    <input class="form-control"
                                           id="nome_admin"
                                           name="nome"
                                           maxlength="100"
                                           th:value="${nome}"
                                           required
                                           autofocus>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="username_admin">Username</label>
                                    <input class="form-control"
                                           id="username_admin"
                                           name="username"
                                           maxlength="100"
                                           th:value="${username}"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="email_admin">E-mail</label>
                                    <input class="form-control"
                                           id="email_admin"
                                           name="email"
                                           type="email"
                                           maxlength="100"
                                           th:value="${email}"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="bio_admin">Sobre mim</label>
                                    <textarea class="form-control" id="bio_admin" name="bio" rows="3" maxlength="500" placeholder="Conte um pouco sobre você..." th:text="${bio}"></textarea>
                                    <div class="form-text">Máximo de 500 caracteres.</div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label" for="senha_admin">Senha</label>
                                    <input class="form-control"
                                           id="senha_admin"
                                           name="senha"
                                           type="password"
                                           th:required="${not edicao}">
                                    <div class="form-text text-muted" th:if="${edicao}">
                                        Deixe em branco para manter a mesma senha.
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button class="btn btn-purple btn-add-music-glow mb-3 fw-bold border-0 px-4" type="submit"
                                            th:text="${edicao ? 'Salvar alterações' : 'Cadastrar usuário'}">
                                    </button>
                                    <a class="btn btn-outline-secondary" href="/usuarios">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:insert="~{fragments/player :: bottom-player}"></div>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                const selector = 'input:not([type="hidden"]):not([disabled]), button:not([disabled]), a:not([disabled])';
                const focusables = Array.from(document.querySelectorAll(selector));
                const index = focusables.indexOf(document.activeElement);
                if (index !== -1) {
                    e.preventDefault();
                    const nextIndex = (index + (e.shiftKey ? -1 : 1) + focusables.length) % focusables.length;
                    focusables[nextIndex].focus();
                }
            } else if (e.key === 'Enter') {
                // If it's a textarea, let it handle Enter normally for linebreaks
                if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') {
                    return;
                }
                if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                    const form = document.activeElement.closest('form');
                    if (form) {
                        e.preventDefault();
                        if (form.reportValidity()) {
                            form.submit();
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
