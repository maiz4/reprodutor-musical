<div id="mini-player" class="collapsed" th:fragment="bottom-player" th:if="${usuarioLogado != null}">
    <button id="player-toggle-tab" class="player-toggle-tab" type="button" onclick="playerTogglePanel()" title="Abrir/fechar player">
        <span class="player-toggle-icon">&#9654;</span>
    </button>
    <div class="player-panel">
        <div class="player-header mb-2 d-flex justify-content-between align-items-center position-relative">
            <button class="player-drag-handle border-0 bg-transparent p-1" id="player-drag-handle" type="button" title="Movimentar o player" style="z-index: 10;">
                <i class="bi bi-hand-index-thumb-fill"></i>
            </button>
            <div class="text-center position-absolute w-100" style="pointer-events: none; left: 0;">
                <h3 class="mb-0">Mini Player</h3>
                <div class="text-secondary small">YouTube áudio</div>
            </div>
            <button class="btn btn-sm btn-outline-secondary border-0 p-1" type="button" onclick="playerTogglePanel()" title="Recolher" style="z-index: 10;">&times;</button>
        </div>

        <div class="player-vinyl-container">
            <div class="player-vinyl" id="player-vinyl">
                <div class="player-vinyl-label"></div>
            </div>
        </div>

        <div class="player-current-title mb-1" id="player-current-title">Nenhum item carregado</div>

        <div class="player-progress-container mb-2">
            <span class="player-time" id="player-time-current">0:00</span>
            <div class="player-progress-bar" id="player-progress-bar" onclick="playerSeek(event)">
                <div class="player-progress-fill" id="player-progress-fill"></div>
                <div class="player-progress-thumb" id="player-progress-thumb"></div>
            </div>
            <span class="player-time" id="player-time-total">0:00</span>
        </div>

        <div class="player-controls mb-3 d-flex align-items-center justify-content-center gap-2">
            <button class="btn btn-outline-secondary btn-sm rounded-circle" type="button" id="player-shuffle-btn" onclick="playerToggleShuffle()" title="Aleatório (Shuffle)">
                <i class="bi bi-shuffle"></i>
            </button>
            <button class="btn btn-outline-primary btn-sm rounded-circle" type="button" onclick="playerPrev()" title="Anterior"><i class="bi bi-skip-start-fill"></i></button>
            <button class="btn btn-purple btn-sm rounded-circle player-play-btn shadow" style="width: 38px; height: 38px;" type="button" onclick="playerPlayPause()" id="player-play-btn" title="Play/Pause">
                <i class="bi bi-play-fill fs-5"></i>
            </button>
            <button class="btn btn-outline-primary btn-sm rounded-circle" type="button" onclick="playerNext()" title="Próximo"><i class="bi bi-skip-end-fill"></i></button>
            <button class="btn btn-outline-secondary btn-sm rounded-circle" type="button" id="player-loop-btn" onclick="playerToggleLoop()" title="Repetir (Loop)">
                <i class="bi bi-repeat"></i>
            </button>
        </div>

        <div class="player-frame-holder">
            <div id="youtube-player"></div>
        </div>

        <div class="mb-3">
            <label class="form-label small mb-1" for="player-playlist-select">Playlist</label>
            <select id="player-playlist-select" class="form-select form-select-sm" onchange="playerSelectPlaylist()">
                <option value="">Selecione uma playlist</option>
            </select>
        </div>

        <button class="btn btn-outline-light btn-sm w-100 mb-2" type="button" onclick="playerLoadFromSelectedPlaylist()">Carregar playlist</button>
        <div class="player-message" id="player-message"></div>
        
        <div class="d-flex justify-content-start align-items-center mb-2">
            <button id="player-toggle-tracklist-btn" class="btn btn-sm text-decoration-none player-tracklist-btn d-none" type="button" onclick="playerToggleTrackList()" title="Ocultar/Mostrar Faixas">
                Faixas &#9650;
            </button>
        </div>
        <div class="player-track-list" id="player-track-list"></div>
        
        <button id="player-reset-pos-btn" class="btn btn-sm btn-outline-secondary w-100 mt-3 d-none" type="button" onclick="playerResetPosition()">Restaurar Posição</button>

        <div class="player-edge player-edge-t" data-resize></div>
        <div class="player-edge player-edge-b" data-resize></div>
        <div class="player-edge player-edge-l" data-resize></div>
        <div class="player-edge player-edge-r" data-resize></div>
    </div>

    <!-- Modal de Confirmação de Duplicidade em Playlist -->
    <div class="modal fade" id="modalConfirmarDuplicado" tabindex="-1" aria-hidden="true" style="z-index: 9999;">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-darker border-secondary shadow-lg">
          <div class="modal-header border-bottom border-secondary border-opacity-25">
            <h5 class="modal-title text-white fw-bold"><i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>Música Já Existente</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-white">
            <p class="mb-0 fs-6">Essa música já existe na playlist, deseja continuar?</p>
          </div>
          <div class="modal-footer border-top border-secondary border-opacity-25">
            <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal" id="btnCancelarDuplicado">Não</button>
            <button type="button" class="btn btn-purple rounded-pill px-4 fw-bold" id="btnConfirmarDuplicado">Sim</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/player.js?v=6"></script>
</div>
