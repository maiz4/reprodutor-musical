<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Perfil de ' + ${perfilNome} + ' - Lynotes'">Perfil - Lynotes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('comunidade')}"></div>

    <main class="spotify-main container py-5">
        
        <!-- Hero de Perfil Público -->
        <div class="music-card-cyber p-4 p-md-5 mb-5">
            <div class="d-flex align-items-center gap-4 flex-wrap flex-md-nowrap">
                <!-- Avatar Circular -->
                <div class="position-relative" style="width: 110px; height: 110px; min-width: 110px;">
                    <img th:if="${perfilFotoUrl != null and !perfilFotoUrl.isEmpty()}" 
                         th:src="${perfilFotoUrl}" 
                         class="w-100 h-100 rounded-circle object-fit-cover shadow border border-purple border-3">
                    <div th:unless="${perfilFotoUrl != null and !perfilFotoUrl.isEmpty()}" 
                         class="w-100 h-100 rounded-circle bg-darker border border-purple border-3 d-flex align-items-center justify-content-center text-purple fw-bold fs-1 shadow">
                        <span th:text="${#strings.substring(perfilNome, 0, 1).toUpperCase()}">U</span>
                    </div>
                </div>

                <!-- Detalhes do Perfil Público -->
                <div class="flex-grow-1">
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <h2 class="glowing-title-library mb-0 fs-2" th:text="${perfilNome}">Nome do Usuário</h2>
                        <span class="badge bg-purple rounded-pill px-3 py-1">Catálogo Público</span>
                    </div>
                    <p class="text-purple font-monospace mb-1">@<span th:text="${perfilUsername}">username</span></p>

                    <!-- Seguidores e Seguindo (estilo discreto e interativo) -->
                    <div class="d-flex align-items-center gap-2 mb-3" style="font-size: 0.9rem;">
                        <button type="button" class="btn btn-link text-secondary p-0 text-decoration-none d-flex align-items-center gap-1 shadow-none social-hover-purple" data-bs-toggle="modal" data-bs-target="#seguidoresModal">
                            <strong class="text-white transition-all" th:text="${seguidores != null ? seguidores.size() : 0}">0</strong>
                            <span class="transition-all ms-1">seguidores</span>
                        </button>
                        <span class="text-secondary opacity-30">•</span>
                        <button type="button" class="btn btn-link text-secondary p-0 text-decoration-none d-flex align-items-center gap-1 shadow-none social-hover-purple" data-bs-toggle="modal" data-bs-target="#seguindoModal">
                            <strong class="text-white transition-all" th:text="${seguindo != null ? seguindo.size() : 0}">0</strong>
                            <span class="transition-all ms-1">seguindo</span>
                        </button>
                    </div>

                    <!-- Pílulas de Estatísticas -->
                    <div class="d-flex gap-2 flex-wrap align-items-center">
                        <span class="badge bg-darker border border-secondary border-opacity-20 px-3 py-2 text-white font-monospace">
                            <i class="bi bi-music-note text-purple me-1"></i> <strong th:text="${musicas != null ? musicas.size() : 0}">0</strong> Músicas
                        </span>
                        <span class="badge bg-darker border border-secondary border-opacity-20 px-3 py-2 text-white font-monospace">
                            <i class="bi bi-mic text-purple me-1"></i> <strong th:text="${artistas != null ? artistas.size() : 0}">0</strong> Artistas
                        </span>
                        <span class="badge bg-darker border border-secondary border-opacity-20 px-3 py-2 text-white font-monospace">
                            <i class="bi bi-disc text-purple me-1"></i> <strong th:text="${albums != null ? albums.size() : 0}">0</strong> Álbuns
                        </span>
                    </div>
                </div>

                <!-- Ação / Voltar -->
                <div>
                    <a class="btn btn-outline-secondary rounded-pill px-4" href="/comunidade">&larr; Voltar</a>
                </div>
            </div>
        </div>

        <!-- MÚSICAS CATALOGADAS DO USUÁRIO -->
        <div class="mb-5">
            <h4 class="text-white fw-bold mb-4 d-flex align-items-center gap-2">
                <i class="bi bi-music-note-beamed text-purple"></i> Músicas Catalogadas
            </h4>

            <div class="alert alert-dark border-purple text-secondary text-center p-4 rounded-4" th:if="${semMusicas}">
                Este usuário ainda não catalogou músicas.
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${semMusicas}">
                <div class="col" th:each="musica : ${musicas}">
                    <div class="music-card-cyber h-100 d-flex flex-column justify-content-between p-4">
                        <div>
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <img th:if="${musica.capaUrl != null and !musica.capaUrl.isBlank()}" th:src="${musica.capaUrl}" class="rounded-3 shadow" style="width: 60px; height: 60px; object-fit: cover;">
                                <div th:unless="${musica.capaUrl != null and !musica.capaUrl.isBlank()}" class="rounded-3 shadow d-flex align-items-center justify-content-center bg-dark text-secondary" style="width: 60px; height: 60px;">
                                    <i class="bi bi-music-note fs-3"></i>
                                </div>
                                <div class="overflow-hidden">
                                    <h6 class="fw-bold text-white mb-0 text-truncate" th:text="${musica.titulo}"></h6>
                                    <p class="text-secondary small mb-0 text-truncate" th:text="${musica.artista}"></p>
                                </div>
                            </div>
                            <p class="text-light small fst-italic mb-3" style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;" th:if="${musica.resenha != null and !musica.resenha.isBlank()}" th:text="${'« ' + musica.resenha + ' »'}"></p>
                        </div>

                        <div class="d-flex align-items-center justify-content-between pt-2 border-top border-secondary border-opacity-10">
                            <button type="button" 
                                    class="btn btn-outline-purple btn-sm rounded-pill px-3" 
                                    th:data-url="${musica.youtubeUrl}"
                                    th:data-titulo="${musica.titulo}"
                                    th:data-artista="${musica.artista}"
                                    th:data-capa="${musica.capaUrl}"
                                    th:data-ytid="${musica.youtubeId}"
                                    onclick="if(typeof playerTocar === 'function') playerTocar(this.getAttribute('data-url'), this.getAttribute('data-titulo'), this.getAttribute('data-artista'), this.getAttribute('data-capa'), this.getAttribute('data-ytid'));">
                                <i class="bi bi-play-fill me-1"></i> Ouvir
                            </button>

                            <div th:if="${musica.nota != null}" class="score-badge-circle">
                                <span th:text="${musica.nota != null ? musica.nota + ' ★' : ''}">5 ★</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal Seguidores -->
    <div class="modal fade" id="seguidoresModal" tabindex="-1" aria-labelledby="seguidoresModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-darker border-secondary text-white rounded-4 shadow">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold" id="seguidoresModalLabel">
                        <i class="bi bi-people-fill text-purple me-2"></i>Seguidores
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="max-height: 400px; overflow-y: auto;">
                    <div th:if="${seguidores == null or seguidores.isEmpty()}" class="text-center py-4 text-secondary">
                        <i class="bi bi-emoji-smile fs-1 mb-2 d-block"></i>
                        Nenhum seguidor ainda.
                    </div>
                    <div class="d-flex flex-column gap-3" th:unless="${seguidores == null or seguidores.isEmpty()}">
                        <div class="d-flex align-items-center justify-content-between p-2 rounded bg-dark bg-opacity-50" th:each="user : ${seguidores}">
                            <div class="d-flex align-items-center gap-3">
                                <img th:if="${user.fotoUrl != null and !user.fotoUrl.isEmpty()}" th:src="${user.fotoUrl}" class="rounded-circle object-fit-cover shadow border border-purple" style="width: 40px; height: 40px;">
                                <div th:unless="${user.fotoUrl != null and !user.fotoUrl.isEmpty()}" class="rounded-circle bg-darker text-purple border border-purple d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px;" th:text="${#strings.substring(user.nome, 0, 1).toUpperCase()}">U</div>
                                <div>
                                    <h6 class="fw-bold mb-0 text-white" th:text="${user.nome}"></h6>
                                    <span class="text-secondary small">@<span th:text="${user.username}">username</span></span>
                                </div>
                            </div>
                            <a th:href="@{'/usuarios/' + ${user.id}}" class="btn btn-outline-purple btn-sm rounded-pill px-3" data-bs-dismiss="modal">Ver Perfil</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Seguindo -->
    <div class="modal fade" id="seguindoModal" tabindex="-1" aria-labelledby="seguindoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-darker border-secondary text-white rounded-4 shadow">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold" id="seguindoModalLabel">
                        <i class="bi bi-person-check-fill text-purple me-2"></i>Seguindo
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="max-height: 400px; overflow-y: auto;">
                    <div th:if="${seguindo == null or seguindo.isEmpty()}" class="text-center py-4 text-secondary">
                        <i class="bi bi-emoji-neutral fs-1 mb-2 d-block"></i>
                        Não está seguindo ninguém ainda.
                    </div>
                    <div class="d-flex flex-column gap-3" th:unless="${seguindo == null or seguindo.isEmpty()}">
                        <div class="d-flex align-items-center justify-content-between p-2 rounded bg-dark bg-opacity-50" th:each="user : ${seguindo}">
                            <div class="d-flex align-items-center gap-3">
                                <img th:if="${user.fotoUrl != null and !user.fotoUrl.isEmpty()}" th:src="${user.fotoUrl}" class="rounded-circle object-fit-cover shadow border border-purple" style="width: 40px; height: 40px;">
                                <div th:unless="${user.fotoUrl != null and !user.fotoUrl.isEmpty()}" class="rounded-circle bg-darker text-purple border border-purple d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px;" th:text="${#strings.substring(user.nome, 0, 1).toUpperCase()}">U</div>
                                <div>
                                    <h6 class="fw-bold mb-0 text-white" th:text="${user.nome}"></h6>
                                    <span class="text-secondary small">@<span th:text="${user.username}">username</span></span>
                                </div>
                            </div>
                            <a th:href="@{'/usuarios/' + ${user.id}}" class="btn btn-outline-purple btn-sm rounded-pill px-3" data-bs-dismiss="modal">Ver Perfil</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
</body>
</html>
