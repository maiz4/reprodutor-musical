<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbuns - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('albuns')}"></div>

    <main class="spotify-main container py-5">
        <!-- Header Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h1 class="glowing-title-library mb-1">Álbuns</h1>
                <p class="text-secondary mb-0">Cadastre e explore os álbuns do acervo musical.</p>
            </div>
            <a class="btn-add-music-glow" href="/albuns/novo">
                <i class="bi bi-plus-circle-fill fs-5"></i> Novo Álbum
            </a>
        </div>

        <!-- Glassmorphism Search Bar -->
        <form class="glass-search-box p-2 mb-5 d-flex align-items-center gap-2" method="get" action="/albuns">
            <i class="bi bi-search text-purple fs-5 ms-3"></i>
            <input class="form-control glass-search-input pe-3"
                   name="busca"
                   placeholder="Buscar álbuns por título, artista..."
                   th:value="${busca}"
                   autocomplete="off"
                   autocorrect="off"
                   autocapitalize="off"
                   spellcheck="false">
            <a th:if="${buscaAtiva}" class="text-secondary small me-2 text-decoration-none" href="/albuns">Limpar</a>
            <button class="glass-search-btn" type="submit">Buscar</button>
        </form>

        <!-- Mensagens Vazio -->
        <div class="alert alert-dark border-purple text-purple text-center p-4 rounded-4 mb-5" th:if="${semAlbums and not buscaAtiva}">
            <i class="bi bi-disc fs-2 mb-2 d-block"></i>
            Nenhum álbum cadastrado ainda. Clique em <strong>Novo Álbum</strong> acima para começar!
        </div>
        <div class="alert alert-dark border-secondary text-secondary text-center p-4 rounded-4 mb-5" th:if="${semAlbums and buscaAtiva}">
            <i class="bi bi-search fs-2 mb-2 d-block"></i>
            Nenhum álbum encontrado para o termo pesquisado.
        </div>

        <!-- Grid de Cards de Álbuns -->
        <div th:unless="${semAlbums}" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            <div class="col" th:each="album : ${albums}">
                <div class="music-card-cyber p-3 h-100 d-flex flex-column justify-content-between">
                    <div>
                        <!-- Capa clicável -->
                        <a th:href="${'/albuns/' + album.id}" class="text-decoration-none d-block">
                            <div class="music-card-cover-container mb-3 position-relative">
                                <img th:if="${album.capaUrl != null and !album.capaUrl.isBlank()}" th:src="${album.capaUrl}" class="music-card-cover" alt="Capa do Álbum">
                                <div th:unless="${album.capaUrl != null and !album.capaUrl.isBlank()}" class="w-100 h-100 d-flex align-items-center justify-content-center bg-dark text-secondary">
                                    <i class="bi bi-disc fs-1 text-purple"></i>
                                </div>
                            </div>
                            <h6 class="fw-bold text-white mb-1 text-truncate hover-purple" th:text="${album.titulo}"></h6>
                        </a>
                        <p class="text-secondary small mb-2 text-truncate" th:text="${album.artista}"></p>
                    </div>
                        <div class="pt-2 border-top border-secondary border-opacity-10 mt-2">
                            <!-- Linha superior: Play (esquerda) e Nota (direita) -->
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <!-- Play -->
                                <button type="button" 
                                        class="btn btn-purple rounded-circle p-0 d-flex align-items-center justify-content-center" 
                                        style="width: 32px; height: 32px; min-width: 32px;"
                                        title="Tocar Álbum no Miniplayer"
                                        th:data-albid="${album.id}"
                                        onclick="if(typeof playerFetchAlbum === 'function') playerFetchAlbum(this.getAttribute('data-albid'), true);">
                                    <i class="bi bi-play-fill text-white fs-5"></i>
                                </button>
                                
                                <!-- Nota / Estrelas -->
                                <div th:if="${album.nota != null}" class="score-badge-circle m-0" title="Sua Avaliação">
                                    <span th:text="${album.nota != null ? album.nota + ' ★' : ''}">5 ★</span>
                                </div>
                            </div>
                            
                            <!-- Linha inferior: Três pontos (esquerda) e Ano (direita) -->
                            <div class="d-flex align-items-center justify-content-between">
                                <div class="dropdown position-relative">
                                    <button class="btn btn-link text-secondary p-0 shadow-none" type="button" title="Opções" onclick="window.toggleOpcoesMenu(event, this)">
                                        <i class="bi bi-three-dots fs-5"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end bg-darker border-secondary shadow">
                                        <li>
                                             <a class="dropdown-item text-purple fw-bold" th:href="${'/albuns/' + album.id + '/editar'}">
                                                <i class="bi bi-star-fill me-2"></i>Avaliar
                                            </a>
                                        </li>
                                        <li>
                                            <form th:action="${'/albuns/' + album.id + '/excluir'}" method="post" th:data-titulo="${album.titulo}" onsubmit="return confirmarExclusaoCustom(this, 'Excluir Álbum?', 'Tem certeza que deseja excluir o álbum &quot;' + this.getAttribute('data-titulo') + '&quot;?', false, event);">
                                                <button type="submit" class="dropdown-item text-danger"><i class="bi bi-trash me-2"></i>Excluir</button>
                                            </form>
                                        </li>
                                    </ul>
                                </div>
                                <span class="text-secondary small font-monospace text-truncate" th:text="${album.anoLancamento != null ? album.anoLancamento : 'Álbum'}"></span>
                            </div>
                        </div>
                </div>
            </div>
        </div>

    </main>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
