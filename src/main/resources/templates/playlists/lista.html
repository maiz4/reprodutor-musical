<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('musicas')}"></div>

    <main class="spotify-main container py-5">
        <!-- Header Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h1 class="glowing-title-library mb-1">Playlists</h1>
                <p class="text-secondary mb-0">Crie e gerencie suas coleções de faixas.</p>
            </div>
            <a class="btn-add-music-glow" href="/playlists/new">
                <i class="bi bi-plus-circle-fill fs-5"></i> Nova Playlist
            </a>
        </div>

        <!-- Alertas de Erro -->
        <div class="alert alert-danger rounded-4 mb-4" th:if="${erro}" th:text="${erro}"></div>

        <!-- Glassmorphism Search Bar -->
        <form class="glass-search-box p-2 mb-5 d-flex align-items-center gap-2" method="get" action="/playlists">
            <i class="bi bi-search text-purple fs-5 ms-3"></i>
            <input class="form-control glass-search-input pe-3"
                   name="busca"
                   placeholder="Buscar playlists por nome..."
                   th:value="${busca}"
                   autocomplete="off"
                   autocorrect="off"
                   autocapitalize="off"
                   spellcheck="false">
            <a th:if="${buscaAtiva}" class="text-secondary small me-2 text-decoration-none" href="/playlists">Limpar</a>
            <button class="glass-search-btn" type="submit">Buscar</button>
        </form>

        <!-- Mensagens Vazio -->
        <div class="alert alert-dark border-purple text-purple text-center p-4 rounded-4 mb-5" th:if="${#lists.isEmpty(playlists) and not buscaAtiva}">
            <i class="bi bi-collection-play fs-2 mb-2 d-block"></i>
            Nenhuma playlist cadastrada ainda. Clique em <strong>Nova Playlist</strong> acima para começar!
        </div>
        <div class="alert alert-dark border-secondary text-secondary text-center p-4 rounded-4 mb-5" th:if="${#lists.isEmpty(playlists) and buscaAtiva}">
            <i class="bi bi-search fs-2 mb-2 d-block"></i>
            Nenhuma playlist encontrada para o termo pesquisado.
        </div>

        <!-- Grid de Cards de Playlists -->
        <div th:unless="${#lists.isEmpty(playlists)}" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            <div class="col" th:each="playlist : ${playlists}">
                <div class="music-card-cyber p-3 h-100 d-flex flex-column justify-content-between position-relative"
                     th:data-href="${'/playlists/' + playlist.id}"
                     onclick="if(!event.target.closest('button, a, input, select, form, ul, li')) { if(window.htmx) htmx.ajax('GET', this.getAttribute('data-href'), {target: '#app-content', select: '#app-content', pushUrl: true}); else window.location.href=this.getAttribute('data-href'); }"
                     style="cursor: pointer;">
                    <div>
                        <!-- Capa da Playlist (Grid 2x2 ou Nota Musical se vazia) -->
                        <div class="playlist-cover-grid ratio ratio-1x1 mb-3 rounded-3 overflow-hidden shadow-sm bg-darker position-relative">
                            <div class="d-grid" style="grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); width: 100%; height: 100%;">
                                <!-- Capa 1 -->
                                <div class="w-100 h-100 bg-secondary bg-opacity-10 d-flex align-items-center justify-content-center"
                                     th:style="${playlistCovers[playlist.id] != null and playlistCovers[playlist.id].size() > 0 ? 'background-image: url(' + playlistCovers[playlist.id][0] + '); background-size: cover; background-position: center;' : ''}">
                                    <i th:if="${playlistCovers[playlist.id] == null or playlistCovers[playlist.id].size() == 0}" class="bi bi-music-note text-secondary opacity-30 fs-5"></i>
                                </div>
                                <!-- Capa 2 -->
                                <div class="w-100 h-100 bg-secondary bg-opacity-10 d-flex align-items-center justify-content-center"
                                     th:style="${playlistCovers[playlist.id] != null and playlistCovers[playlist.id].size() > 1 ? 'background-image: url(' + playlistCovers[playlist.id][1] + '); background-size: cover; background-position: center;' : ''}">
                                    <i th:if="${playlistCovers[playlist.id] == null or playlistCovers[playlist.id].size() <= 1}" class="bi bi-music-note text-secondary opacity-30 fs-5"></i>
                                </div>
                                <!-- Capa 3 -->
                                <div class="w-100 h-100 bg-secondary bg-opacity-10 d-flex align-items-center justify-content-center"
                                     th:style="${playlistCovers[playlist.id] != null and playlistCovers[playlist.id].size() > 2 ? 'background-image: url(' + playlistCovers[playlist.id][2] + '); background-size: cover; background-position: center;' : ''}">
                                    <i th:if="${playlistCovers[playlist.id] == null or playlistCovers[playlist.id].size() <= 2}" class="bi bi-music-note text-secondary opacity-30 fs-5"></i>
                                </div>
                                <!-- Capa 4 -->
                                <div class="w-100 h-100 bg-secondary bg-opacity-10 d-flex align-items-center justify-content-center"
                                     th:style="${playlistCovers[playlist.id] != null and playlistCovers[playlist.id].size() > 3 ? 'background-image: url(' + playlistCovers[playlist.id][3] + '); background-size: cover; background-position: center;' : ''}">
                                    <i th:if="${playlistCovers[playlist.id] == null or playlistCovers[playlist.id].size() <= 3}" class="bi bi-music-note text-secondary opacity-30 fs-5"></i>
                                </div>
                            </div>
                        </div>
                        
                        <h6 class="fw-bold text-white mb-1 text-truncate" th:text="${playlist.nome}"></h6>
                        <span class="badge bg-purple rounded-pill px-2 py-0.5 mb-2" style="font-size: 0.65rem;" th:if="${playlist.oculta and playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">Oculta</span>
                    </div>

                    <div class="pt-2 border-top border-secondary border-opacity-10 mt-2">
                        <!-- Linha superior: Play (esquerda) e Indicador de Faixas (direita) -->
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <!-- Play -->
                            <button type="button" 
                                    class="btn btn-purple rounded-circle p-0 d-flex align-items-center justify-content-center shadow-sm" 
                                    style="width: 32px; height: 32px; min-width: 32px;"
                                    title="Carregar Playlist no Miniplayer"
                                    th:data-plid="${playlist.id}"
                                    onclick="event.stopPropagation(); if(typeof playerFetchPlaylist === 'function') playerFetchPlaylist(this.getAttribute('data-plid'), true);">
                                <i class="bi bi-play-fill text-white fs-5"></i>
                            </button>
                            
                            <span class="text-purple small fw-semibold">Acessar <i class="bi bi-chevron-right ms-0.5"></i></span>
                        </div>
                        
                        <!-- Linha inferior: Três pontos (esquerda) e Data de criação (direita) -->
                        <div class="d-flex align-items-center justify-content-between">
                            <div class="dropdown position-relative">
                                <button class="btn btn-link text-secondary p-0 shadow-none" type="button" title="Opções" onclick="window.toggleOpcoesMenu(event, this)">
                                    <i class="bi bi-three-dots fs-5"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end bg-darker border-secondary shadow">
                                    <li th:if="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                        <a class="dropdown-item text-purple fw-bold" th:href="${'/playlists/' + playlist.id + '/editar'}">
                                            <i class="bi bi-pencil me-2"></i>Editar
                                        </a>
                                    </li>
                                    <li th:unless="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                        <span class="dropdown-item text-secondary disabled" title="Playlist padrão não pode ser editada.">
                                            <i class="bi bi-lock me-2"></i>Editar (Fixa)
                                        </span>
                                    </li>
                                    <li th:if="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                        <form method="post" 
                                              th:action="${'/playlists/' + playlist.id + '/excluir'}" 
                                              th:data-nome="${playlist.nome}"
                                              onsubmit="return confirmarExclusaoCustom(this, 'Excluir Playlist?', 'Tem certeza que deseja excluir a playlist &quot;' + this.getAttribute('data-nome') + '&quot;?', false, event);"
                                              class="m-0">
                                            <button type="submit" class="dropdown-item text-danger">
                                                <i class="bi bi-trash me-2"></i>Excluir
                                            </button>
                                        </form>
                                    </li>
                                    <li th:unless="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                        <span class="dropdown-item text-secondary disabled" title="Playlist padrão não pode ser excluída.">
                                            <i class="bi bi-trash me-2"></i>Excluir (Fixa)
                                        </span>
                                    </li>
                                </ul>
                            </div>
                            <span class="text-secondary small font-monospace text-truncate" style="font-size: 0.7rem;" th:text="${playlist.criadoEmFormatado != null ? playlist.criadoEmFormatado : 'Playlist'}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
            </div>
        </div>

    </main>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
</body>
</html>
