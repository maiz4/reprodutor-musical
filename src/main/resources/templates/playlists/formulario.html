<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${edicao} ? 'Editar Playlist - Lynotes' : 'Nova Playlist - Lynotes'">Nova Playlist - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('musicas')}"></div>

    <main class="spotify-main container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                
                <!-- Card Cyberpunk do Formulário -->
                <div class="music-card-cyber p-4 p-md-5">
                    <div class="mb-4">
                        <h2 class="glowing-title-library mb-1" th:text="${edicao} ? 'Editar Playlist' : 'Nova Playlist'">Nova Playlist</h2>
                        <p class="text-secondary mb-0">Organize suas faixas favoritas em uma seleção personalizada.</p>
                    </div>

                    <div class="alert alert-danger rounded-4 mb-4" th:if="${erro}" th:text="${erro}"></div>

                    <form method="post" th:action="${acao}">
                        <!-- Nome da Playlist -->
                        <div class="mb-4">
                            <label class="form-label text-purple font-monospace small uppercase fw-bold" for="nome">Nome da Playlist</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-purple">
                                    <i class="bi bi-collection-play"></i>
                                </span>
                                <input class="form-control glass-search-input bg-dark border-secondary p-3 text-white"
                                       id="nome"
                                       name="nome"
                                       th:value="${nome}"
                                       placeholder="Ex: Minhas Preferidas 2026, Workout Glow..."
                                       required
                                       maxlength="100"
                                       autocomplete="off">
                            </div>
                        </div>

                        <!-- Checkbox Oculta (Apenas na edição) -->
                        <div class="form-check form-switch mb-4" th:if="${edicao}">
                            <input class="form-check-input bg-dark border-secondary" type="checkbox" id="oculta" name="oculta" th:checked="${playlist != null and playlist.oculta}">
                            <label class="form-check-label text-secondary small" for="oculta">Ocultar esta playlist do seu perfil público</label>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary border-opacity-10">
                            <a class="btn btn-outline-secondary rounded-pill px-4" href="/playlists">Cancelar</a>
                            <button class="btn-add-music-glow px-4" type="submit">
                                <i class="bi bi-check-circle-fill me-1"></i>
                                <span th:text="${edicao} ? 'Salvar Alterações' : 'Criar Playlist'">Criar Playlist</span>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            if (!form) return;

            const isEdicao = [[${edicao}]];

            // If there's an error passed from server, alert it
            const erroMsg = [[${erro}]];
            if (erroMsg) {
                if (typeof window.exibirAlertCustom === 'function') {
                    window.exibirAlertCustom('Atenção', erroMsg);
                } else {
                    alert(erroMsg);
                }
            }

            form.addEventListener('submit', async (e) => {
                if (isEdicao) {
                    return;
                }

                e.preventDefault();
                e.stopPropagation();

                const nomeInput = document.getElementById('nome');
                const nome = nomeInput.value.trim();

                if (!nome) {
                    if (typeof window.exibirAlertCustom === 'function') {
                        window.exibirAlertCustom('Atenção', 'O nome da playlist não pode ser vazio.');
                    } else {
                        alert('O nome da playlist não pode ser vazio.');
                    }
                    return;
                }

                const btnSubmit = form.querySelector('button[type="submit"]');
                const originalText = btnSubmit.innerHTML;
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Criando...';

                try {
                    const res = await fetch('/api/playlists', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ nome: nome })
                    });

                    if (res.ok) {
                        const playlist = await res.json();
                        if (window.htmx) htmx.ajax('GET', '/playlists/' + playlist.id, {target: '#app-content', select: '#app-content', pushUrl: true}); else window.location.href = '/playlists/' + playlist.id;
                    } else {
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = originalText;
                        const errMsg = await res.text();
                        if (typeof window.exibirAlertCustom === 'function') {
                            window.exibirAlertCustom('Erro ao Criar Playlist', errMsg || 'Verifique se o nome é válido.');
                        } else {
                            alert(errMsg || 'Erro ao criar playlist. Verifique se o nome é válido.');
                        }
                    }
                } catch (err) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = originalText;
                    if (typeof window.exibirAlertCustom === 'function') {
                        window.exibirAlertCustom('Erro de Conexão', 'Erro ao se conectar ao servidor.');
                    } else {
                        alert('Erro ao se conectar ao servidor.');
                    }
                }
            });
        });
    </script>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
</body>
</html>
