<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${playlist.nome} + ' - Lynotes'">Playlist - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('musicas')}"></div>

    <main class="spotify-main container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <!-- Back link -->
                <div class="mb-3">
                    <a href="/musicas" class="text-secondary text-decoration-none hover-purple small">&larr; Voltar para Músicas</a>
                </div>

                <!-- Playlist Header Hero Card (Delicate and Sleek) -->
                <div class="music-card-cyber p-3 rounded-4 mb-4">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-3 overflow-hidden">
                            <div class="shadow d-flex align-items-center justify-content-center" style="width: 56px; height: 56px; min-width: 56px; background-color: #B57CFF; color: #000000; border-radius: 12px !important;">
                                <i class="bi bi-collection-play fs-3"></i>
                            </div>
                            <div class="overflow-hidden">
                                <div class="d-flex align-items-center gap-2 mb-1">
                                    <span class="badge bg-purple rounded-pill px-2.5 py-1 small fw-bold" style="font-size: 0.7rem;">PLAYLIST</span>
                                    <span class="badge bg-secondary rounded-pill px-2 py-0.5 small" th:if="${playlist.oculta and playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}" style="font-size: 0.65rem;">Oculta</span>
                                </div>
                                <h3 class="fw-bold text-white mb-0 text-truncate" th:text="${playlist.nome}">Minha Playlist</h3>
                                <p class="text-secondary small mb-0 mt-1" th:if="${playlist.nome == 'Músicas Catalogadas' or playlist.nome == 'Músicas do seu catálogo'}">
                                    <i class="bi bi-info-circle text-purple me-1"></i> Toda música cadastrada no seu catálogo é salva automaticamente nesta playlist para você ouvi-las de forma contínua.
                                </p>
                            </div>
                        </div>

                        <!-- Botões de Ação da Playlist -->
                        <div class="d-flex align-items-center gap-2">
                            <!-- Tocar Playlist Completa -->
                            <button type="button" 
                                    class="btn btn-primary rounded-pill px-3 py-2 fw-semibold shadow d-flex align-items-center gap-2"
                                    th:data-id="${playlist.id}"
                                    th:data-nome="${playlist.nome}"
                                    onclick="if(typeof playerTocarPlaylist === 'function') playerTocarPlaylist(this.getAttribute('data-id'), this.getAttribute('data-nome'));">
                                <i class="bi bi-play-fill fs-5"></i>
                                <span>Tocar</span>
                            </button>

                            <!-- Menu Opções -->
                            <button class="btn btn-outline-secondary rounded-circle p-2 d-flex align-items-center justify-content-center" 
                                    type="button" 
                                    data-bs-toggle="dropdown" 
                                    aria-expanded="false" 
                                    style="width: 40px; height: 40px;"
                                    title="Mais opções">
                                <i class="bi bi-three-dots"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-lg border-secondary rounded-3">
                                <li>
                                    <button class="dropdown-item d-flex align-items-center gap-2" 
                                            type="button"
                                            th:data-id="${playlist.id}"
                                            th:data-nome="${playlist.nome}"
                                            onclick="if(typeof playerTocarPlaylistEmOrdemAleatoria === 'function') playerTocarPlaylistEmOrdemAleatoria(this.getAttribute('data-id'), this.getAttribute('data-nome'));">
                                        <i class="bi bi-shuffle text-purple"></i> Ordem Aleatória
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item d-flex align-items-center gap-2" 
                                            type="button"
                                            th:data-id="${playlist.id}"
                                            th:data-nome="${playlist.nome}"
                                            onclick="if(typeof playerTocarPlaylistEmLoop === 'function') playerTocarPlaylistEmLoop(this.getAttribute('data-id'), this.getAttribute('data-nome'));">
                                        <i class="bi bi-repeat text-purple"></i> Tocar em Loop
                                    </button>
                                </li>
                                <li th:if="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}"><hr class="dropdown-divider border-secondary opacity-25"></li>
                                <li th:if="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                    <form th:action="${'/playlists/' + playlist.id + '/toggle-oculta'}" method="post" class="m-0">
                                        <button class="dropdown-item" type="submit">
                                            <i class="bi me-2" th:classappend="${playlist.oculta ? 'bi-eye' : 'bi-eye-slash'}"></i>
                                            <span th:text="${playlist.oculta ? 'Tornar Visível' : 'Ocultar Playlist'}">Ocultar</span>
                                        </button>
                                    </form>
                                </li>
                                <li th:if="${playlist.nome != 'Músicas Catalogadas' and playlist.nome != 'Músicas do seu catálogo'}">
                                    <form method="post" 
                                          th:action="${'/playlists/' + playlist.id + '/excluir'}" 
                                          th:data-nome="${playlist.nome}"
                                          onsubmit="return confirmarExclusaoCustom(this, 'Excluir Playlist?', 'Tem certeza que deseja excluir a playlist &quot;' + this.getAttribute('data-nome') + '&quot;?', false, event);" 
                                          class="m-0">
                                        <button class="dropdown-item text-danger" type="submit">
                                            <i class="bi bi-trash me-2"></i>Excluir
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Formulário: Adicionar Faixa por Pesquisa do YouTube -->
                <div class="mb-4 p-4 rounded-4 border border-purple bg-darker shadow">
                    <label class="form-label text-purple font-monospace small uppercase fw-bold mb-2" for="ytQuery">
                        <i class="bi bi-youtube text-danger me-1"></i> Pesquisar Música para Adicionar
                    </label>
                    <div class="alert alert-danger rounded-4 mb-3" th:if="${erro}" th:text="${erro}"></div>
                    
                    <div class="position-relative">
                        <input type="text"
                               id="ytQuery"
                               class="form-control glass-search-input bg-dark text-white border-secondary pe-5"
                               placeholder="Digite o título da música ou artista..."
                               autocomplete="off"
                               autocorrect="off"
                               autocapitalize="off"
                               spellcheck="false"
                               oninput="window.debounceSearchYT('MUSICA')"
                               onkeydown="window.handleKeyNav(event, 'MUSICA')">
                        <button type="button" class="btn text-purple position-absolute top-50 end-0 translate-middle-y me-2 p-1 border-0" onclick="window.buscarYT('MUSICA')" title="Buscar Música">
                            <i class="bi bi-search fs-5 text-purple"></i>
                        </button>
                    </div>

                    <!-- Spinner -->
                    <div id="ytSpinner" class="text-center py-3 d-none">
                        <div class="spinner-border spinner-border-sm text-purple" role="status"></div>
                        <span class="text-secondary small ms-2">Buscando faixas no YouTube...</span>
                    </div>

                    <!-- Resultados -->
                    <div id="ytResults" class="d-flex flex-column gap-2 mt-3 overflow-auto" style="max-height: 280px;"></div>
                </div>

                <!-- Formulário Oculto para Envio -->
                <form id="formAdicionarItem" method="post" th:action="${'/playlists/' + playlist.id + '/items'}" th:attr="data-playlist-id=${playlist.id}" hx-boost="true" style="display:none;">
                    <input type="hidden" id="titulo" name="titulo">
                    <input type="hidden" id="artista" name="artista">
                    <input type="hidden" id="duracaoSegundos" name="duracaoSegundos">
                    <input type="hidden" id="youtubeUrl" name="youtubeUrl">
                    <input type="hidden" id="youtubeId" name="youtubeId">
                    <input type="hidden" id="capaUrl" name="capaUrl">
                </form>

                <!-- Lista de Faixas / Itens da Playlist -->
                <div class="glass-card p-4 rounded-4 shadow-lg">
                    <h4 class="fw-bold text-white mb-4 d-flex align-items-center gap-2">
                        <i class="bi bi-music-note-list text-purple"></i> Músicas da Playlist
                    </h4>

                    <div class="alert alert-dark border-secondary text-secondary text-center p-4 rounded-4 mb-0" th:if="${items == null or items.isEmpty()}">
                        <i class="bi bi-music-note fs-2 mb-2 d-block"></i>
                        Nenhuma música nesta playlist ainda.
                    </div>

                    <div class="d-flex flex-column gap-3" th:unless="${items == null or items.isEmpty()}">
                        <div class="d-flex align-items-center justify-content-between p-3 rounded-3 bg-darker border border-secondary border-opacity-10" 
                             th:each="item, iter : ${items}" 
                             th:id="${'item-' + item.id}"
                             th:classappend="${item.oculta ? 'opacity-50 text-muted bg-dark' : ''}">
                            
                            <div class="d-flex align-items-center gap-3 overflow-hidden">
                                <span class="fw-bold text-purple font-monospace ms-2 fs-5" th:text="${iter.count}">1</span>
                                
                                <!-- Imagem da Capa da Música -->
                                <img th:src="${item.capaUrl}" class="rounded-3 shadow" style="width: 50px; height: 50px; min-width: 50px; object-fit: cover;" loading="lazy" alt="Capa">

                                <div class="overflow-hidden">
                                    <h6 class="fw-bold mb-0 text-truncate fs-6" th:text="${item.titulo}" th:classappend="${item.oculta ? 'text-secondary text-decoration-line-through' : 'text-white'}"></h6>
                                    <span th:if="${item.oculta}" class="badge bg-secondary text-white ms-0 mt-1 d-inline-block" style="font-size: 0.65rem;">Desativada</span>
                                    <span class="text-secondary small text-truncate d-block mt-1" th:text="${item.artista}" style="font-size: 0.82rem;"></span>
                                </div>
                            </div>

                            <div class="d-flex align-items-center gap-2">
                                <!-- Botão Ocultar / Desocultar -->
                                <form th:action="${'/playlists/' + playlist.id + '/items/' + item.id + '/toggle-oculta'}" method="post" class="d-inline-block m-0 align-middle">
                                    <button type="submit"
                                            class="btn btn-link p-0 me-2 text-decoration-none shadow-none"
                                            th:title="${item.oculta ? 'Reativar faixa na playlist' : 'Ocultar/Desativar faixa da playlist'}">
                                        <i th:class="${item.oculta ? 'bi bi-eye-slash-fill text-warning fs-5' : 'bi bi-eye text-secondary fs-5'}"></i>
                                    </button>
                                </form>

                                <button type="button" 
                                        class="btn btn-outline-purple btn-sm rounded-pill px-3"
                                        th:data-url="${item.url}"
                                        th:data-titulo="${item.titulo}"
                                        th:data-artista="${item.artista}"
                                        th:data-ytid="${item.videoId}"
                                        onclick="if(typeof playerTocar === 'function') playerTocar(this.getAttribute('data-url'), this.getAttribute('data-titulo'), this.getAttribute('data-artista'), '', this.getAttribute('data-ytid'));">
                                    <i class="bi bi-play-fill me-1"></i> Tocar
                                </button>
                                
                                <form method="post" 
                                      th:action="${'/playlists/' + playlist.id + '/items/' + item.id + '/remover'}" 
                                      th:data-playlist-nome="${playlist.nome}"
                                      onsubmit="return confirmarRemocaoItem(this.getAttribute('data-playlist-nome'), this);"
                                      class="m-0">
                                    <button class="btn btn-outline-danger btn-sm rounded-pill px-3" type="submit" title="Remover Música">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script th:inline="javascript">
        function confirmarRemocaoItem(playlistNome, formElement) {
            if (playlistNome === 'Músicas Catalogadas' || playlistNome === 'Músicas do seu catálogo') {
                return confirmarExclusaoCustom(formElement, "Remover Música?", "Esta música pertence ao seu catálogo de <strong>Músicas Catalogadas</strong>. Escolha como deseja prosseguir:", true);
            } else {
                return confirmarExclusaoCustom(formElement, "Remover da Playlist?", "Deseja remover esta música da playlist?", false);
            }
        }

        (function() {
            let searchTimer = null;
            let itemsList = [];
            let activeIndex = -1;

            window.debounceSearchYT = function(tipo) {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => window.buscarYT(tipo), 250);
            };

            window.handleKeyNav = function(e, tipo) {
                const resultsDiv = document.getElementById('ytResults');
                if (!resultsDiv || itemsList.length === 0) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        window.buscarYT(tipo);
                    }
                    return;
                }

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    activeIndex = (activeIndex + 1) % itemsList.length;
                    window.updateHighlightPlaylist();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    activeIndex = (activeIndex - 1 + itemsList.length) % itemsList.length;
                    window.updateHighlightPlaylist();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (activeIndex >= 0 && activeIndex < itemsList.length) {
                        window.selecionarItem(activeIndex);
                    } else {
                        window.buscarYT(tipo);
                    }
                }
            };

            window.updateHighlightPlaylist = function() {
                const resultsDiv = document.getElementById('ytResults');
                if (!resultsDiv) return;
                const children = resultsDiv.querySelectorAll('.yt-result-item');
                children.forEach((child, idx) => {
                    if (idx === activeIndex) {
                        child.classList.add('active-item');
                        child.scrollIntoView({ block: 'nearest' });
                    } else {
                        child.classList.remove('active-item');
                    }
                });
            }

            window.buscarYT = function(tipo) {
                const queryInput = document.getElementById('ytQuery');
                if (!queryInput) return;
                const query = queryInput.value.trim();
                const resultsDiv = document.getElementById('ytResults');
                const spinner = document.getElementById('ytSpinner');

                if (!query) {
                    if (resultsDiv) resultsDiv.innerHTML = '';
                    activeIndex = -1;
                    return;
                }

                if (spinner) spinner.classList.remove('d-none');
                if (resultsDiv) resultsDiv.innerHTML = '';
                activeIndex = -1;

                fetch('/api/youtube/search?q=' + encodeURIComponent(query) + '&tipo=' + tipo)
                    .then(r => r.json())
                    .then(data => {
                        if (spinner) spinner.classList.add('d-none');
                        itemsList = data || [];
                        activeIndex = -1;
                        if (!resultsDiv) return;
                        if (itemsList.length === 0) {
                            resultsDiv.innerHTML = '<div class="text-secondary small p-2">Nenhum resultado encontrado.</div>';
                            return;
                        }
                        resultsDiv.innerHTML = itemsList.map((item, idx) => `
                            <div class="d-flex align-items-center justify-content-between p-2.5 rounded bg-dark border border-secondary border-opacity-25 cursor-pointer yt-result-item" data-index="${idx}" onclick="window.selecionarItem(${idx})" onmouseenter="activeIndex = ${idx}; window.updateHighlightPlaylist();">
                                <div class="d-flex align-items-center gap-3 overflow-hidden">
                                    <img src="${item.capaUrl || '/public/img/default-cover.png'}" class="rounded-3 shadow-sm" style="width: 50px; height: 50px; min-width: 50px; object-fit: cover;">
                                    <div class="overflow-hidden">
                                        <div class="fw-bold text-white small text-truncate">${escapeHtml(item.titulo)}</div>
                                        <div class="text-secondary extra-small text-truncate">${escapeHtml(item.artistaOuCanal)}</div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-purple rounded-pill px-3 ms-2">Adicionar</button>
                            </div>
                        `).join('');
                    })
                    .catch(() => {
                        if (spinner) spinner.classList.add('d-none');
                        if (resultsDiv) resultsDiv.innerHTML = '<div class="text-danger small p-2">Erro ao realizar a busca.</div>';
                    });
            };

            function escapeHtml(text) {
                return (text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
            }

            window.selecionarItem = function(idx) {
                const item = itemsList[idx];
                if (!item) return;

                document.getElementById('titulo').value = item.titulo;
                document.getElementById('artista').value = item.artistaOuCanal;
                document.getElementById('duracaoSegundos').value = item.duracaoSegundos || '';
                document.getElementById('youtubeUrl').value = item.youtubeUrl || '';
                document.getElementById('youtubeId').value = item.youtubeId || '';
                document.getElementById('capaUrl').value = item.capaUrl || '';

                const form = document.getElementById('formAdicionarItem');
                const currentPlId = form ? form.getAttribute('data-playlist-id') : /*[[${playlist.id}]]*/ '';
                
                if (typeof window.checarESubmeterPlaylist === 'function') {
                    window.checarESubmeterPlaylist(form, currentPlId, item.youtubeId, item.youtubeUrl);
                } else if (window.htmx) {
                    htmx.ajax('POST', form.action, { values: new FormData(form), target: '#app-content', select: '#app-content', pushUrl: true });
                } else if (typeof form.requestSubmit === 'function') {
                    form.requestSubmit();
                } else {
                    form.submit();
                }
            };
        })();
    </script>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
</body>
</html>
