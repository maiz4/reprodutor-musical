<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistas - Lynotes</title>
    <!-- Fonte Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
    <link href="/css/player.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
</head>
<body hx-boost="true" hx-select="#app-content" hx-target="#app-content" class="library-bg text-white">
<div id="app-content">

    <div th:insert="~{fragments/navbar :: navbar('artistas')}"></div>

    <main class="spotify-main container py-5">
        <!-- Header Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h1 class="glowing-title-library mb-1">Artistas</h1>
                <p class="text-secondary mb-0">Cadastre e explore os artistas do catálogo musical.</p>
            </div>
            <a class="btn-add-music-glow" href="/artistas/novo">
                <i class="bi bi-plus-circle-fill fs-5"></i> Novo Artista
            </a>
        </div>

        <!-- Glassmorphism Search Bar -->
        <form class="glass-search-box p-2 mb-5 d-flex align-items-center gap-2" method="get" action="/artistas">
            <i class="bi bi-search text-purple fs-5 ms-3"></i>
            <input class="form-control glass-search-input pe-3"
                   name="busca"
                   placeholder="Buscar artistas por nome, gênero, biografia..."
                   th:value="${busca}"
                   autocomplete="off"
                   autocorrect="off"
                   autocapitalize="off"
                   spellcheck="false">
            <a th:if="${buscaAtiva}" class="text-secondary small me-2 text-decoration-none" href="/artistas">Limpar</a>
            <button class="glass-search-btn" type="submit">Buscar</button>
        </form>

        <!-- Mensagens Vazio -->
        <div class="alert alert-dark border-purple text-purple text-center p-4 rounded-4 mb-5" th:if="${semArtistas and not buscaAtiva}">
            <i class="bi bi-mic fs-2 mb-2 d-block"></i>
            Nenhum artista cadastrado ainda. Clique em <strong>Novo Artista</strong> acima para começar!
        </div>
        <div class="alert alert-dark border-secondary text-secondary text-center p-4 rounded-4 mb-5" th:if="${semArtistas and buscaAtiva}">
            <i class="bi bi-search fs-2 mb-2 d-block"></i>
            Nenhum artista encontrado para o termo pesquisado.
        </div>

        <!-- Grid de Cards de Artistas -->
        <div th:unless="${semArtistas}" class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            <div class="col" th:each="artista : ${listaArtistas}">
                <div class="music-card-cyber h-100 d-flex flex-column justify-content-between text-center p-4">
                    <div>
                        <!-- Foto do Artista -->
                        <div class="position-relative mx-auto mb-3" style="width: 130px; height: 130px;">
                            <img th:src="${artista.capaUrl != null and !artista.capaUrl.isBlank() ? artista.capaUrl : '/img/default-artist.svg'}" class="rounded-circle w-100 h-100 shadow border border-purple border-2" style="object-fit: cover;" alt="Foto do Artista">
                        </div>

                        <!-- Informações do Artista -->
                        <h5 class="fw-bold text-white mb-1 text-truncate" th:text="${artista.nome}"></h5>
                        <p class="text-secondary small mb-2 text-truncate" th:text="${artista.generoMusical != null ? artista.generoMusical : 'Artista'}"></p>
                        <p class="text-secondary small text-truncate-2" style="font-size: 0.85rem;" th:text="${artista.biografia != null ? artista.biografia : 'Sem biografia informada.'}"></p>
                    </div>

                    <!-- Botões de Ação de Edição / Exclusão -->
                    <div class="pt-3 border-top border-secondary border-opacity-10 mt-3 d-flex justify-content-center gap-2">
                        <a class="btn btn-outline-purple btn-sm px-3 rounded-pill" th:href="${'/artistas/' + artista.id + '/editar'}">
                            <i class="bi bi-pencil-square me-1"></i> Editar
                        </a>
                        <form method="post" th:action="${'/artistas/' + artista.id + '/excluir'}" th:data-nome="${artista.nome}" onsubmit="return confirmarExclusaoCustom(this, 'Excluir Artista?', 'Tem certeza que deseja excluir o artista &quot;' + this.getAttribute('data-nome') + '&quot;?', false, event);" class="m-0">
                            <button class="btn btn-outline-danger btn-sm px-3 rounded-pill" type="submit">
                                <i class="bi bi-trash-fill me-1"></i> Excluir
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>

</div>

<div th:insert="~{fragments/player :: bottom-player}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
