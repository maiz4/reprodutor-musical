<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Lynotes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body class="auth-container">
    <div class="card auth-card p-3 border-0" style="width: 100%; max-width: 400px; margin: auto;">
        <div class="card-body p-2">
            <div class="text-center mb-3">
                <h1 class="h4 fw-bold auth-title mb-1">Entrar no Lynotes</h1>
                <p class="text-secondary small mb-0">Acesse o seu catálogo pessoal e social</p>
            </div>

            <div class="alert alert-danger rounded-3 p-2 small mb-3" th:if="${erro}" th:text="${erro}"></div>
            <div class="alert alert-success rounded-3 p-2 small mb-3" th:if="${param.recuperado}" th:text="'Senha redefinida com sucesso!'"></div>

            <form method="post" action="/login">
                <!-- Input Usuário / Email com Ícone -->
                <div class="mb-3">
                    <label class="form-label text-white fw-bold small mb-1" for="usuario">Usuário / E-mail</label>
                    <div class="auth-input-group">
                        <span class="auth-icon">
                            <i class="bi bi-person"></i>
                        </span>
                        <input class="form-control" id="usuario" name="usuario"
                               th:value="${usuarioInformado}" required autofocus
                               placeholder="Digite seu username ou e-mail">
                    </div>
                </div>

                <!-- Input Senha com Ícone -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label text-white fw-bold small mb-0" for="senha">Senha</label>
                        <a href="/recuperar" class="text-purple extra-small text-decoration-none hover-purple" style="font-size: 0.78rem;">Esqueceu a senha?</a>
                    </div>
                    <div class="auth-input-group">
                        <span class="auth-icon">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input class="form-control" id="senha" name="senha"
                               type="password" required
                               placeholder="Sua senha secreta">
                    </div>
                </div>

                <button class="btn btn-purple btn-add-music-glow w-100 btn-lg mb-3 fw-bold border-0" style="padding: 10px 0;" type="submit">Entrar</button>
            </form>

            <div class="text-center mb-2">
                <span class="text-secondary small">Ainda não tem uma conta?</span>
                <a href="/usuarios/novo" class="text-purple small fw-bold ms-1 text-decoration-none hover-purple">Comece aqui</a>
            </div>
            <div class="text-center">
                <a href="/" class="text-secondary small text-decoration-none hover-purple">&larr; Voltar para a tela inicial</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                const selector = 'input:not([type="hidden"]):not([disabled]), button:not([disabled]), a:not([disabled])';
                const focusables = Array.from(document.querySelectorAll(selector));
                const index = focusables.indexOf(document.activeElement);
                if (index !== -1) {
                    e.preventDefault();
                    const nextIndex = (index + (e.shiftKey ? -1 : 1) + focusables.length) % focusables.length;
                    focusables[nextIndex].focus();
                }
            } else if (e.key === 'Enter') {
                if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                    const form = document.activeElement.closest('form');
                    if (form) {
                        e.preventDefault();
                        if (form.reportValidity()) {
                            form.submit();
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
