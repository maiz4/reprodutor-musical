<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Lynotes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body class="auth-container">
    <div class="card auth-card p-3 border-0" style="width: 100%; max-width: 400px; margin: auto;">
        <div class="card-body p-2">
            <div class="text-center mb-3">
                <h1 class="h4 fw-bold auth-title mb-1">Recuperar Senha</h1>
                <p class="text-secondary small mb-0">Redefina o seu acesso com facilidade</p>
            </div>

            <!-- Alertas de Erro -->
            <div class="alert alert-danger rounded-3 p-2 small mb-3" th:if="${erro}" th:text="${erro}"></div>

            <!-- PASSO 1: Informar o E-mail -->
            <div th:if="${step == 1}">
                <form method="post" action="/recuperar/solicitar">
                    <div class="mb-3">
                        <label class="form-label text-white fw-bold small mb-1" for="email">E-mail Cadastrado</label>
                        <div class="auth-input-group">
                            <span class="auth-icon">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input class="form-control" id="email" name="email" type="email" required autofocus
                                   placeholder="seu-email@exemplo.com" th:value="${email}">
                        </div>
                    </div>

                    <button class="btn btn-purple btn-add-music-glow w-100 btn-lg mb-3 fw-bold border-0" style="padding: 10px 0;" type="submit">Enviar Código</button>
                </form>
            </div>

            <!-- PASSO 2: Inserir Código e Nova Senha -->
            <div th:if="${step == 2}">
                <div class="alert alert-info rounded-3 p-2 small mb-3 text-center" style="background-color: rgba(187, 134, 252, 0.1); border-color: rgba(187, 134, 252, 0.2); color: #BB86FC;">
                    Código enviado! Copie o código impresso no console do servidor.
                </div>
                <form method="post" action="/recuperar/confirmar">
                    <input type="hidden" name="email" th:value="${email}">
                    
                    <!-- Campo Código -->
                    <div class="mb-3">
                        <label class="form-label text-white fw-bold small mb-1" for="codigo">Código de 6 dígitos</label>
                        <div class="auth-input-group">
                            <span class="auth-icon">
                                <i class="bi bi-shield-lock"></i>
                            </span>
                            <input class="form-control" id="codigo" name="codigo" type="text" pattern="\d{6}" maxlength="6" required autofocus
                                   placeholder="000000" th:value="${codigo}">
                        </div>
                    </div>

                    <!-- Nova Senha -->
                    <div class="mb-3">
                        <label class="form-label text-white fw-bold small mb-1" for="novaSenha">Nova Senha</label>
                        <div class="auth-input-group">
                            <span class="auth-icon">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input class="form-control" id="novaSenha" name="novaSenha" type="password" required
                                   placeholder="Mínimo 6 caracteres">
                        </div>
                    </div>

                    <!-- Confirmação da Senha -->
                    <div class="mb-3">
                        <label class="form-label text-white fw-bold small mb-1" for="confirmacaoSenha">Confirmar Nova Senha</label>
                        <div class="auth-input-group">
                            <span class="auth-icon">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input class="form-control" id="confirmacaoSenha" name="confirmacaoSenha" type="password" required
                                   placeholder="Repita a senha">
                        </div>
                    </div>

                    <button class="btn btn-purple btn-add-music-glow w-100 btn-lg mb-3 fw-bold border-0" style="padding: 10px 0;" type="submit">Redefinir Senha</button>
                </form>
            </div>

            <div class="text-center">
                <a href="/login" class="text-secondary small text-decoration-none hover-purple">&larr; Voltar para o login</a>
            </div>
        </div>
    </div>
</body>
</html>
