<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro Interno - Lynotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: #cf6679; /* Lynotes error red */
            text-shadow: 0 0 20px rgba(207, 102, 121, 0.4);
        }
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #e0e0e0;
        }
    </style>
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand bg-dark navbar-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold text-purple" href="/">Lynotes</a>
        </div>
    </nav>

    <main class="container">
        <div class="error-container">
            <div class="error-code">500</div>
            <h1 class="mb-3">Ops! Algo deu errado</h1>
            <p class="error-message">Nossos servidores desafinaram por um momento.<br>J&aacute; registramos o erro no log e nossa equipe vai dar uma olhada nisso em breve!</p>
            <a href="/" class="btn btn-primary btn-lg rounded-pill px-5">Voltar para o In&iacute;cio</a>
        </div>
    </main>

</body>
</html>
